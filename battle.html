<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>Battle Balls</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one column — header, then the start screen, a player's spin-and-pick turn, or the arena */
:root {
  --sky: #fdf3d8;
  --ink: #2f3a1f;
  --btn: #fffaf0;
  --frame: #2b2f4a;
  --blue: #2f7de1;
  --red: #e0402f;
  --gold: #f5b82e;
  --gold-dark: #b9801a;
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--sky);
  color: var(--ink);
  font-family: var(--display);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  box-sizing: border-box;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}
.wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.titles { display: flex; align-items: baseline; gap: 12px; }
.back { font-size: .85rem; font-weight: 600; color: var(--frame); text-decoration: none; }
.back:hover, .back:focus-visible { text-decoration: underline; }
h1 { font-size: 1.6rem; font-weight: 700; margin: 0; }
button {
  font-family: var(--display); font-weight: 600; color: var(--ink); cursor: pointer;
  background: var(--btn); border: 2px solid var(--frame); border-radius: 14px;
  box-shadow: 0 3px 0 var(--frame);
}
button:active { transform: translateY(3px); box-shadow: 0 0 0 var(--frame); }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: default; transform: none; box-shadow: 0 3px 0 var(--frame); }

/* start screen */
.lead { margin: 0; text-align: center; font-weight: 500; line-height: 1.4; }
/* turn screen: spin for 3 balls, pick 1 */
.turn { background: var(--btn); border: 3px solid var(--team); border-radius: 18px; box-shadow: 0 5px 0 var(--team);
  padding: 14px 12px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.turn.blue { --team: var(--blue); }
.turn.red { --team: var(--red); }
.turn small { font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; opacity: .7; }
.turn h2 { margin: 0; font-size: 1.7rem; color: var(--team); }
.turn p { margin: 0; font-weight: 500; min-height: 1.3em; }
.reels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
.reel { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px 10px; min-width: 0; border-color: var(--team); box-shadow: 0 3px 0 var(--team); }
.reel canvas { width: 84px; height: 100px; border-radius: 10px; background: #151832; }
.reel b { font-size: .92rem; line-height: 1.15; min-height: 1.15em; }
.reel span { font-size: .72rem; line-height: 1.2; opacity: .75; min-height: 2.4em; }
.reel:disabled { opacity: 1; }
.reel.chosen { background: #fff1c9; outline: 3px solid var(--gold); }
.go { font-size: 1.3rem; padding: 12px; background: var(--gold); border-color: var(--gold-dark); box-shadow: 0 4px 0 var(--gold-dark); }
.wins { background: var(--btn); border: 2px solid var(--frame); border-radius: 14px; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
.wins h2 { margin: 0; font-size: 1.1rem; }
.wins .note { margin: 0; font-size: .78rem; opacity: .65; }
.bar-row { display: grid; grid-template-columns: 4.2em 1fr 3ch; gap: 8px; align-items: center; font-size: .9rem; }
.bar-track { height: 14px; border-radius: 7px; background: rgba(43, 47, 74, .1); overflow: hidden; }
.bar { height: 100%; border-radius: 7px; min-width: 3px; transition: width .4s; }
.bar-row b { text-align: right; font-variant-numeric: tabular-nums; }

/* arena */
.board {
  position: relative; margin: 0 auto;
  width: min(100%, calc((100vh - 240px) * 400 / 540));
  width: min(100%, calc((100dvh - 240px) * 400 / 540));
  min-width: 220px; max-width: 100%;
  border: 6px solid var(--frame); border-radius: 16px; overflow: hidden; background: #151832; box-sizing: border-box;
}
canvas#c { display: block; width: 100%; height: auto; touch-action: none; }
.overlay {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; background: rgba(15, 17, 38, .78); color: #fff; text-align: center; padding: 16px;
}
.overlay h2 { margin: 0; font-size: 1.8rem; text-wrap: balance; }
.overlay p { margin: 0; font-size: 1.1rem; }
.overlay .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.overlay button { font-size: 1.05rem; padding: 10px 20px; }
.overlay .again { background: var(--gold); border-color: var(--gold-dark); box-shadow: 0 3px 0 var(--gold-dark); }
.aim-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.aim-pair { display: flex; gap: 6px; }
.aim-pair.red { justify-content: flex-end; }
.aim-pair button { width: 52px; height: 52px; font-size: 1.5rem; color: var(--team); border-color: var(--team); box-shadow: 0 3px 0 var(--team); }
.aim-pair.blue { --team: var(--blue); }
.aim-pair.red { --team: var(--red); }
.go-fight { font-size: 1.35rem; padding: 12px 22px; background: var(--gold); border-color: var(--gold-dark); box-shadow: 0 4px 0 var(--gold-dark); }
.arena-actions { display: flex; justify-content: center; }
.arena-actions button { font-size: 1rem; padding: 10px 22px; }
@media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="titles"><a class="back" href="index.html">‹ Menu</a><h1>Battle Balls</h1></header>

  <section id="selectView" aria-label="Start">
    <div class="wrap" style="padding:0">
      <p class="lead">Pass and play for 2 players. Every round, each player spins for 3 balls and picks 1. First to win 2 rounds takes the match!</p>
      <button class="go" id="goBtn">Start match</button>
      <section class="wins" aria-labelledby="winsTitle">
        <h2 id="winsTitle">Wins by ball</h2>
        <div id="winBars"></div>
        <p class="note" id="winsNote">Loading…</p>
      </section>
    </div>
  </section>

  <section id="turnView" hidden aria-label="Pick your ball">
    <div class="turn blue" id="turnCard">
      <small id="turnRound">Round 1</small>
      <h2 id="turnTitle">Blue player's turn</h2>
      <p id="turnHint">Hand the device to Blue, then spin!</p>
      <div class="reels" id="reels"></div>
      <button class="go" id="spinBtn">🎰 Spin!</button>
    </div>
    <div class="arena-actions" style="margin-top:12px"><button id="turnQuit">‹ Quit match</button></div>
  </section>

  <section id="arenaView" hidden aria-label="Arena">
    <div class="wrap" style="padding:0">
      <div class="board">
        <canvas id="c" width="400" height="540" aria-label="Battle arena"></canvas>
        <div class="overlay" id="matchOver" hidden>
          <h2 id="moTitle">Spike Ball wins!</h2>
          <p id="moText">2 – 1</p>
          <div class="row">
            <button class="again" id="rematchBtn">Play again</button>
          </div>
        </div>
      </div>
      <div class="aim-row" id="aimRow" hidden>
        <div class="aim-pair blue"><button data-team="0" data-dir="-1" aria-label="Turn the blue arrow left">⟲</button><button data-team="0" data-dir="1" aria-label="Turn the blue arrow right">⟳</button></div>
        <button class="go-fight" id="fightBtn">GO!</button>
        <div class="aim-pair red"><button data-team="1" data-dir="-1" aria-label="Turn the red arrow left">⟲</button><button data-team="1" data-dir="1" aria-label="Turn the red arrow right">⟳</button></div>
      </div>
      <div class="arena-actions"><button id="quitBtn">‹ Quit match</button></div>
    </div>
  </section>
</div>

<script src="scores.js"></script>
<script>
// ================= ball types =================
const TYPES = {
  spike:  {name: 'Spike Ball',        short: 'Spike',  color: '#8a6a43', power: 'Horn stabs hurt',         speed: 190},
  shock:  {name: 'Shock Ball',        short: 'Shock',  color: '#3a7bd5', power: 'Zaps & stuns 2 sec',      speed: 190},
  fire:   {name: 'Fire Ball',         short: 'Fire',   color: '#f06a1d', power: 'Shoots fire every 2 sec', speed: 190},
  ice:    {name: 'Ice Ball',          short: 'Ice',    color: '#8fd6f2', power: 'Freezes into a snowball', speed: 190},
  rubber: {name: 'Super Rubber Ball', short: 'Rubber', color: '#ff4fa0', power: 'Fastest bouncer',         speed: 330},
  poop:   {name: 'Poop Ball',         short: 'Poop',   color: '#7a4a24', power: 'So gross it hurts',       speed: 190},
  bomb:   {name: 'Bomb Ball',         short: 'Bomb',   color: '#2b2b33', power: 'Drops bombs that blow up', speed: 190},
  ghost:  {name: 'Ghost Ball',        short: 'Ghost',  color: '#e4defc', power: 'Fades so hits pass through', speed: 190},
  laser:  {name: 'Laser Ball',        short: 'Laser',  color: '#7d8794', power: 'Fires a laser straight ahead', speed: 190},
  ninja:  {name: 'Ninja Ball',        short: 'Ninja',  color: '#26262e', power: 'Throws ninja stars',      speed: 190},
  slime:  {name: 'Slime Ball',        short: 'Slime',  color: '#5fd35a', power: 'Leaves gooey puddles',    speed: 190},
  bubble: {name: 'Bubble Ball',       short: 'Bubble', color: '#4fc0e0', power: 'Shield blocks a hit',     speed: 190},
};
const ORDER = ['spike', 'shock', 'fire', 'ice', 'rubber', 'poop', 'bomb', 'ghost', 'laser', 'ninja', 'slime', 'bubble'];
const TEAM = [{color: '#2f7de1', light: '#7fb6ff'}, {color: '#e0402f', light: '#ff8a7a'}];

// damage and timing
const HP = 75, R = 30, OVERTIME = 40;   // overtime (everyone slowly loses energy) starts after 40 sec
// balanced with simulated rounds: every ball wins roughly 42–58% of its fights
const DMG = {spike: 26, shock: 10, shockDrain: 3.2, rubber: 11, poop: 12, fire: 16, freezeBase: 3, freezeRamp: 5.5,
  bomb: 40, ghost: 12, laser: 58, star: 26, slime: 14, bubble: 8, shieldBack: 18, laserEvery: 1.3, bombRadius: 80};
const STUN_S = 2, FREEZE_S = 2, IMMUNE_S = 3.5, FIRE_EVERY = 2, BOMB_FUSE = 1.5;
const GROSS = ['Gross!', "I'm gonna puke!"];

// arena (canvas units)
const W = 400, H = 540, AX0 = 12, AX1 = 388, AY0 = 74, AY1 = 528;
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; };
function mix(h1, h2, k) {
  const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
  const ch = s => Math.round(((a >> s) & 255) * (1 - k) + ((b >> s) & 255) * k);
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}
function prng(seed) { let s = (Math.abs(seed) % 2147483646) + 1; return () => (s = s * 16807 % 2147483647) / 2147483647; }

// ================= drawing a ball =================
function sphere(c, x, y, r, color) {
  const g = c.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r * 1.05);
  g.addColorStop(0, mix(color, '#ffffff', .45)); g.addColorStop(.6, color); g.addColorStop(1, mix(color, '#000000', .35));
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
}

// o: {g: 0 plain sphere → 1 fully powered, ang: heading (horn, lens, headband tails), t: time, shield: bubble shield up}
function drawBall(c, type, x, y, r, o) {
  const g = o.g, t = o.t, col = TYPES[type].color;
  c.save();
  // --- behind the body
  if (type === 'fire' && g > 0) {
    for (let layer = 0; layer < 2; layer++) for (let i = 0; i < 12; i++) {
      const a = i / 12 * TAU + t * 1.5 + layer * .26;
      const len = r * (.38 + .28 * Math.sin(t * 12 + i * 1.9 + layer)) * g * (layer ? .6 : 1);
      c.fillStyle = layer ? '#ffe066' : '#ff9a1f';
      c.beginPath();
      c.moveTo(x + Math.cos(a - .24) * r * .9, y + Math.sin(a - .24) * r * .9);
      c.quadraticCurveTo(x + Math.cos(a - .1) * (r + len * .7), y + Math.sin(a - .1) * (r + len * .7), x + Math.cos(a + .08) * (r + len), y + Math.sin(a + .08) * (r + len));
      c.lineTo(x + Math.cos(a + .24) * r * .9, y + Math.sin(a + .24) * r * .9);
      c.fill();
    }
  }
  if (type === 'shock' && g > 0) {
    const gl = c.createRadialGradient(x, y, r * .8, x, y, r * 1.6);
    gl.addColorStop(0, `rgba(140,200,255,${.55 * g})`); gl.addColorStop(1, 'rgba(140,200,255,0)');
    c.fillStyle = gl; c.beginPath(); c.arc(x, y, r * 1.6, 0, TAU); c.fill();
  }
  if (type === 'ice' && g > 0) {
    c.fillStyle = '#eafcff'; c.strokeStyle = '#8fcfe6'; c.lineWidth = 1.2;
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * TAU + .2;
      c.beginPath();
      c.moveTo(x + Math.cos(a - .2) * r * .92, y + Math.sin(a - .2) * r * .92);
      c.lineTo(x + Math.cos(a) * (r + r * .38 * g), y + Math.sin(a) * (r + r * .38 * g));
      c.lineTo(x + Math.cos(a + .2) * r * .92, y + Math.sin(a + .2) * r * .92);
      c.fill(); c.stroke();
    }
  }
  if (type === 'spike' && g > 0) {
    const a = o.ang, L = r + r * .95 * g;
    const hg = c.createLinearGradient(x, y, x + Math.cos(a) * L, y + Math.sin(a) * L);
    hg.addColorStop(0, '#d9c49a'); hg.addColorStop(1, '#fff6dc');
    c.fillStyle = hg; c.strokeStyle = '#9c7f4f'; c.lineWidth = 1.5;
    c.beginPath();
    c.moveTo(x + Math.cos(a - .42) * r * .85, y + Math.sin(a - .42) * r * .85);
    c.quadraticCurveTo(x + Math.cos(a - .12) * (r + L) / 2, y + Math.sin(a - .12) * (r + L) / 2, x + Math.cos(a) * L, y + Math.sin(a) * L);
    c.quadraticCurveTo(x + Math.cos(a + .2) * (r + L) / 2, y + Math.sin(a + .2) * (r + L) / 2, x + Math.cos(a + .42) * r * .85, y + Math.sin(a + .42) * r * .85);
    c.closePath(); c.fill(); c.stroke();
  }

  if (type === 'ghost' && g > 0) {   // wispy tails trailing behind
    c.fillStyle = `rgba(228,222,252,${.55 * g})`;
    for (let i = -1; i <= 1; i++) {
      const a = o.ang + Math.PI + i * .45 + Math.sin(t * 5 + i) * .12, L = r * (1.1 + .25 * Math.sin(t * 7 + i * 2)) * g;
      c.beginPath();
      c.moveTo(x + Math.cos(a - .35) * r * .8, y + Math.sin(a - .35) * r * .8);
      c.quadraticCurveTo(x + Math.cos(a) * (r + L * .6), y + Math.sin(a) * (r + L * .6), x + Math.cos(a + .1) * (r + L), y + Math.sin(a + .1) * (r + L));
      c.lineTo(x + Math.cos(a + .35) * r * .8, y + Math.sin(a + .35) * r * .8);
      c.fill();
    }
  }
  if (type === 'ninja' && g > 0) {   // headband tails fluttering behind
    c.strokeStyle = '#e0302a'; c.lineWidth = r * .16; c.lineCap = 'round';
    for (const k of [-1, 1]) {
      const a = o.ang + Math.PI + k * .25, bx = x + Math.cos(a) * r * .9, by = y + Math.sin(a) * r * .9;
      c.beginPath(); c.moveTo(bx, by);
      for (let s2 = 1; s2 <= 4; s2++) {
        const d = r * .32 * s2 * g, wv = Math.sin(t * 12 + s2 + k) * r * .12 * s2 / 2;
        c.lineTo(bx + Math.cos(a) * d - Math.sin(a) * wv, by + Math.sin(a) * d + Math.cos(a) * wv);
      }
      c.stroke();
    }
  }
  if (type === 'slime' && g > 0) {   // drips
    c.fillStyle = '#4cbf48';
    for (let i = -1; i <= 1; i++) {
      const dx = i * r * .45, h = r * (.25 + .18 * Math.sin(t * 3 + i * 2)) * g;
      c.beginPath(); c.ellipse(x + dx, y + r * .85 + h / 2, r * .14, h / 2 + r * .1, 0, 0, TAU); c.fill();
    }
  }

  // --- the body
  sphere(c, x, y, r, col);

  // --- surface details, clipped to the ball
  c.save(); c.beginPath(); c.arc(x, y, r, 0, TAU); c.clip(); c.globalAlpha = g;
  if (type === 'spike') {
    for (let i = 0; i < 18; i++) {
      const a = i * 2.399, d = r * (.12 + .8 * ((i * .37) % 1)), s = r * (.06 + .07 * ((i * .618) % 1));
      c.fillStyle = i % 3 === 0 ? '#5e4426' : i % 3 === 1 ? '#b08d5c' : '#6f7d3a';
      c.beginPath(); c.ellipse(x + Math.cos(a) * d, y + Math.sin(a) * d, s * 1.3, s, a, 0, TAU); c.fill();
    }
    c.strokeStyle = '#4f3920'; c.lineWidth = r * .05;
    c.beginPath(); c.moveTo(x - r * .6, y + r * .3); c.lineTo(x - r * .25, y + r * .45); c.lineTo(x - r * .1, y + r * .75); c.stroke();
  } else if (type === 'shock') {
    const rnd = prng(Math.floor(t * 14) + 7);
    c.strokeStyle = '#fff36b'; c.lineWidth = r * .08; c.lineJoin = 'round';
    for (let k = 0; k < 3; k++) {
      let px = x - r, py = y + (rnd() - .5) * r * 1.4;
      c.beginPath(); c.moveTo(px, py);
      for (let s = 0; s < 6; s++) { px += r / 3; py += (rnd() - .5) * r * .7; c.lineTo(px, py); }
      c.stroke();
    }
  } else if (type === 'fire') {
    const fg = c.createRadialGradient(x, y + r * .2, 1, x, y, r);
    fg.addColorStop(0, 'rgba(255,230,90,.9)'); fg.addColorStop(1, 'rgba(255,230,90,0)');
    c.fillStyle = fg; c.fillRect(x - r, y - r, r * 2, r * 2);
  } else if (type === 'ice') {
    c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = r * .05;
    c.beginPath();
    c.moveTo(x - r * .7, y - r * .1); c.lineTo(x - r * .1, y - r * .3); c.lineTo(x + r * .6, y - r * .55);
    c.moveTo(x - r * .1, y - r * .3); c.lineTo(x + r * .1, y + r * .5);
    c.moveTo(x - r * .5, y + r * .5); c.lineTo(x + r * .1, y + r * .5); c.lineTo(x + r * .7, y + r * .2);
    c.stroke();
  } else if (type === 'rubber') {
    c.lineWidth = r * .32; c.strokeStyle = '#ffd23f';
    c.beginPath();
    for (let i = 0; i <= 20; i++) { const xx = -r + i * r / 10; c.lineTo(x + xx, y + Math.sin(i / 20 * TAU) * r * .25); }
    c.stroke();
    c.lineWidth = r * .12; c.strokeStyle = '#4cc9f0';
    c.beginPath();
    for (let i = 0; i <= 20; i++) { const xx = -r + i * r / 10; c.lineTo(x + xx, y + r * .5 + Math.sin(i / 20 * TAU) * r * .2); }
    c.stroke();
  } else if (type === 'bomb') {
    c.fillStyle = 'rgba(255,255,255,.12)';
    c.beginPath(); c.arc(x, y, r * .62, 0, TAU); c.fill();
    c.strokeStyle = '#ffcf3f'; c.lineWidth = r * .1;
    c.beginPath(); c.arc(x, y, r * .62, 0, TAU); c.stroke();
  } else if (type === 'ghost') {
    c.strokeStyle = 'rgba(160,140,230,.55)'; c.lineWidth = r * .07;
    for (let k = 0; k < 3; k++) { c.beginPath(); c.arc(x + (k - 1) * r * .3, y + Math.sin(t * 2 + k) * r * .15, r * (.25 + k * .1), .5, 2.6); c.stroke(); }
  } else if (type === 'laser') {
    c.strokeStyle = 'rgba(40,45,55,.55)'; c.lineWidth = r * .05;
    c.beginPath(); c.moveTo(x - r, y - r * .35); c.lineTo(x + r, y - r * .35); c.moveTo(x - r, y + r * .35); c.lineTo(x + r, y + r * .35);
    c.moveTo(x - r * .35, y - r); c.lineTo(x - r * .35, y + r); c.stroke();
  } else if (type === 'ninja') {
    c.strokeStyle = '#e0302a'; c.lineWidth = r * .3;
    c.beginPath(); c.moveTo(x - r, y - r * .1); c.lineTo(x + r, y - r * .1); c.stroke();
    c.strokeStyle = '#ff6b5e'; c.lineWidth = r * .06;
    c.beginPath(); c.moveTo(x - r, y - r * .2); c.lineTo(x + r, y - r * .2); c.stroke();
  } else if (type === 'slime') {
    c.fillStyle = 'rgba(220,255,200,.55)';
    for (let k = 0; k < 5; k++) { const a = k * 2.3 + t * .8, d = r * (.2 + .5 * ((k * .37) % 1)); c.beginPath(); c.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, r * (.07 + .05 * (k % 2)), 0, TAU); c.fill(); }
  } else if (type === 'bubble') {
    c.fillStyle = 'rgba(255,255,255,.45)';
    for (let k = 0; k < 4; k++) { const a = k * 1.7 + .4, d = r * .55; c.beginPath(); c.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, r * (.08 + .04 * k), 0, TAU); c.fill(); }
  } else if (type === 'poop') {
    c.strokeStyle = '#4f2d12'; c.lineWidth = r * .1;
    c.beginPath();
    for (let a = 0; a < 5 * Math.PI; a += .2) { const rr = r * .1 + a / (5 * Math.PI) * r * .8; c.lineTo(x + Math.cos(a + t) * rr, y + Math.sin(a + t) * rr * .8); }
    c.stroke();
  }
  c.restore();

  // --- in front of the body
  if (type === 'shock' && g > 0) {
    const rnd = prng(Math.floor(t * 14) + 99);
    c.strokeStyle = `rgba(255,243,107,${g})`; c.lineWidth = 2; c.lineJoin = 'round';
    for (let k = 0; k < 4; k++) {
      const a0 = k / 4 * TAU + rnd() * 1.2;
      c.beginPath();
      for (let s = 0; s <= 5; s++) {
        const a = a0 + s * .14, rr = r * (1.05 + (s % 2 ? .3 : .08) + rnd() * .1);
        c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
      }
      c.stroke();
    }
  }
  if (type === 'poop' && g > 0) {
    c.strokeStyle = `rgba(124,194,66,${.85 * g})`; c.lineWidth = 2;
    for (let i = -1; i <= 1; i++) {
      c.beginPath();
      for (let s = 0; s <= 8; s++) {
        const yy = y - r - 2 - s * r * .1 * g;
        c.lineTo(x + i * r * .5 + Math.sin(s * .9 + t * 6 + i) * 3, yy);
      }
      c.stroke();
    }
    for (let i = 0; i < 2; i++) {
      const a = t * 3.2 + i * Math.PI, fx = x + Math.cos(a) * r * 1.45, fy = y + Math.sin(a) * r * 1.1;
      c.fillStyle = 'rgba(255,255,255,.8)';
      c.beginPath(); c.ellipse(fx - 2, fy - 2, 2.2, 1.3, -.5, 0, TAU); c.ellipse(fx + 2, fy - 2, 2.2, 1.3, .5, 0, TAU); c.fill();
      c.fillStyle = '#111'; c.beginPath(); c.arc(fx, fy, 1.8, 0, TAU); c.fill();
    }
  }
  if (type === 'bomb' && g > 0) {   // fuse and spark
    const fx = x + r * .45, fy = y - r * .85;
    c.fillStyle = '#4a4a55'; c.save(); c.translate(fx, fy); c.rotate(.5); c.fillRect(-r * .18, -r * .12, r * .36, r * .24); c.restore();
    c.strokeStyle = '#c9a26b'; c.lineWidth = r * .07;
    const ex = fx + r * .4 * g, ey = fy - r * .45 * g;
    c.beginPath(); c.moveTo(fx, fy); c.quadraticCurveTo(fx + r * .35 * g, fy - r * .1, ex, ey); c.stroke();
    const sp = 1 + .4 * Math.sin(t * 30);
    c.fillStyle = '#ffe066';
    c.beginPath();
    for (let i = 0; i < 10; i++) { const a = i / 10 * TAU, rr = (i % 2 ? r * .1 : r * .26) * sp * g; c.lineTo(ex + Math.cos(a) * rr, ey + Math.sin(a) * rr); }
    c.fill();
  }
  if (type === 'laser' && g > 0) {   // glowing lens pointing where it's heading
    const lx = x + Math.cos(o.ang) * r * .55, ly = y + Math.sin(o.ang) * r * .55;
    const lg = c.createRadialGradient(lx, ly, 1, lx, ly, r * .5);
    lg.addColorStop(0, `rgba(255,80,100,${.8 * g})`); lg.addColorStop(1, 'rgba(255,80,100,0)');
    c.fillStyle = lg; c.beginPath(); c.arc(lx, ly, r * .5, 0, TAU); c.fill();
    c.fillStyle = '#2b2f38'; c.beginPath(); c.arc(lx, ly, r * .3 * g, 0, TAU); c.fill();
    c.fillStyle = '#ff2448'; c.beginPath(); c.arc(lx, ly, r * .2 * g, 0, TAU); c.fill();
    c.fillStyle = '#ffd0d8'; c.beginPath(); c.arc(lx - r * .06, ly - r * .06, r * .06 * g, 0, TAU); c.fill();
  }
  if (type === 'bubble' && g > 0 && o.shield !== false) {   // the shield bubble
    const br = r * 1.35;
    c.fillStyle = `rgba(210,245,255,${.18 * g})`; c.beginPath(); c.arc(x, y, br, 0, TAU); c.fill();
    const sg = c.createLinearGradient(x - br, y - br, x + br, y + br);
    sg.addColorStop(0, '#9fe4f7'); sg.addColorStop(.5, '#f6b6ff'); sg.addColorStop(1, '#fff3a0');
    c.strokeStyle = sg; c.globalAlpha = .85 * g; c.lineWidth = 2.5; c.beginPath(); c.arc(x, y, br, 0, TAU); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 3; c.beginPath(); c.arc(x, y, br * .82, 3.6, 4.4); c.stroke();
    c.globalAlpha = 1;
  }
  if (type === 'rubber' || type === 'ice' || type === 'bubble' || type === 'bomb') {
    c.fillStyle = `rgba(255,255,255,${.6 * g})`;
    c.beginPath(); c.ellipse(x - r * .35, y - r * .45, r * .3, r * .15, -.6, 0, TAU); c.fill();
  }
  c.restore();
}

function drawShip(c, x, y, team, t) {
  const col = TEAM[team].color;
  c.save(); c.translate(x, y);
  c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(0, 40, 34, 8, 0, 0, TAU); c.fill();
  c.fillStyle = mix(col, '#ffffff', .55); c.globalAlpha = .9;
  c.beginPath(); c.ellipse(0, -7, 17, 15, 0, Math.PI, 0); c.fill(); c.globalAlpha = 1;
  c.fillStyle = 'rgba(255,255,255,.7)'; c.beginPath(); c.ellipse(-6, -14, 5, 3, -.4, 0, TAU); c.fill();
  const body = c.createLinearGradient(0, -8, 0, 10);
  body.addColorStop(0, '#e6ebf5'); body.addColorStop(1, '#9aa3b8');
  c.fillStyle = body; c.strokeStyle = '#6c7590'; c.lineWidth = 1.5;
  c.beginPath(); c.ellipse(0, 0, 42, 11, 0, 0, TAU); c.fill(); c.stroke();
  c.fillStyle = col; c.beginPath(); c.ellipse(0, 3, 32, 4.5, 0, 0, TAU); c.fill();
  for (let i = -2; i <= 2; i++) {
    c.fillStyle = (Math.floor(t * 6) + i) % 2 ? '#fff36b' : '#ff9f43';
    c.beginPath(); c.arc(i * 14, 3, 2.4, 0, TAU); c.fill();
  }
  c.restore();
}

// ================= battle state =================
let world = null, match = null, lastFrame = 0, overAt = -Infinity;

function makeBall(type, team) {
  return {type, team, x: team ? 290 : 110, y: 300, vx: 0, vy: 0, r: R, g: 0, hp: HP, ang: team ? Math.PI : 0,
    aim: team ? rand(2.4, 3.9) : rand(-.8, .8), saved: null,
    stun: 0, freeze: 0, freezeT: 0, frozenDmg: 0, immune: 0, squash: 0,
    fireCd: rand(.8, 1.6), bombCd: rand(1, 2), laserCd: rand(1.2, 2), ninjaCd: rand(.8, 1.6), slimeCd: .5,
    shield: true, shieldT: 0, slimeDmg: 0,
    say: '', sayT: 0, hurtT: -9, dying: null};
}
function newWorld(a, b) {
  return {balls: [makeBall(a, 0), makeBall(b, 1)], shots: [], bombs: [], puddles: [], beams: [], shards: [], rings: [], texts: [],
    time: 0, phase: 'intro', introT: 0, overT: 0, contactCd: 0, overtime: false, winner: null, loser: null, counted: false};
}
// start moving the way the arrow points
function launch(b) { const sp = TYPES[b.type].speed; b.vx = Math.cos(b.aim) * sp; b.vy = Math.sin(b.aim) * sp; b.ang = b.aim; }
const other = b => world.balls[1 - b.team];
const immobile = b => b.stun > 0 || b.freeze > 0;
const faded = b => b.type === 'ghost' && world.phase === 'fight' && (world.time + b.team * 1.3) % 4 > 2.5;

// stunned or frozen balls stop, then carry on in the same direction
function stop(b) { if (!immobile(b) && (b.vx || b.vy)) b.saved = {vx: b.vx, vy: b.vy}; b.vx = b.vy = 0; }
function resume(b) {
  const s = b.saved, sp = TYPES[b.type].speed, m = s ? Math.hypot(s.vx, s.vy) : 0;
  if (m) { b.vx = s.vx / m * sp; b.vy = s.vy / m * sp; } else { const a = rand(0, TAU); b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp; }
}

function addText(x, y, text, color, size = 18) { world.texts.push({x, y, text, color, size, t: world.time}); }
function burst(x, y, colors, n, speed = 160) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), v = rand(40, speed);
    world.shards.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: rand(.4, .9), size: rand(2, 4.5), color: colors[i % colors.length]});
  }
}
function hurt(b, n, show = true) {
  if (b.hp <= 0) return;
  b.hp = Math.max(0, b.hp - n);
  if (show) { addText(b.x, b.y - b.r - 10, '-' + Math.round(n), '#ff6b6b'); b.hurtT = world.time; }
}
// Bubble Ball's shield soaks up one hit, then grows back
function blocked(v) {
  if (v.type !== 'bubble' || !v.shield) return false;
  v.shield = false; v.shieldT = DMG.shieldBack;
  addText(v.x, v.y - v.r - 14, 'Pop!', '#bfefff', 18); burst(v.x, v.y, ['#e6fbff', '#9fe4f7', '#ffffff'], 16, 200);
  return true;
}

function walls(b) {
  let hit = false;
  if (b.x < AX0 + b.r) { b.x = AX0 + b.r; b.vx = Math.abs(b.vx); hit = true; }
  if (b.x > AX1 - b.r) { b.x = AX1 - b.r; b.vx = -Math.abs(b.vx); hit = true; }
  if (b.y < AY0 + b.r) { b.y = AY0 + b.r; b.vy = Math.abs(b.vy); hit = true; }
  if (b.y > AY1 - b.r) { b.y = AY1 - b.r; b.vy = -Math.abs(b.vy); hit = true; }
  if (hit) b.squash = 1;
}

function shoot(b, kind, a, speed) {
  world.shots.push({kind, x: b.x + Math.cos(a) * (b.r + 6), y: b.y + Math.sin(a) * (b.r + 6), vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
    r: kind === 'fire' ? 8 : 7, owner: b.team, bounces: 0, spin: 0});
}

function fireLaser(b) {
  const cx = Math.cos(b.ang), cy = Math.sin(b.ang), o = other(b);
  const tx = cx > 0 ? (AX1 - b.x) / cx : cx < 0 ? (AX0 - b.x) / cx : Infinity;
  const ty = cy > 0 ? (AY1 - b.y) / cy : cy < 0 ? (AY0 - b.y) / cy : Infinity;
  const len = Math.min(tx, ty);
  world.beams.push({x1: b.x + cx * b.r, y1: b.y + cy * b.r, x2: b.x + cx * len, y2: b.y + cy * len, t: world.time});
  const px = o.x - b.x, py = o.y - b.y, along = px * cx + py * cy;
  if (along > 0 && along < len + o.r && Math.abs(px * cy - py * cx) < o.r + 5 && !faded(o) && !blocked(o)) {
    hurt(o, DMG.laser); burst(o.x - cx * o.r, o.y - cy * o.r, ['#ff3355', '#ffd0d8'], 10);
  }
}

// what an attacker does to the ball it touches
function effect(att, vic, nx, ny) {
  switch (att.type) {
    case 'spike':
      if (Math.cos(att.ang) * nx + Math.sin(att.ang) * ny > Math.cos(.75) && !blocked(vic)) { hurt(vic, DMG.spike); addText(vic.x, vic.y + vic.r + 18, 'Stab!', '#f3e6c4', 16); burst(vic.x - nx * vic.r, vic.y - ny * vic.r, ['#fff6dc', '#ff6b6b'], 8); }
      break;
    case 'shock':
      if (vic.immune <= 0 && vic.freeze <= 0 && !blocked(vic)) { stop(vic); vic.stun = STUN_S; vic.immune = IMMUNE_S; hurt(vic, DMG.shock); addText(vic.x, vic.y + vic.r + 18, 'Zap!', '#fff36b', 16); }
      break;
    case 'ice':
      if (vic.immune <= 0 && vic.stun <= 0 && !blocked(vic)) { stop(vic); vic.freeze = FREEZE_S; vic.freezeT = 0; vic.frozenDmg = 0; vic.immune = IMMUNE_S; addText(vic.x, vic.y + vic.r + 22, 'Brrr!', '#cdf3ff', 16); }
      break;
    case 'rubber':
      if (!blocked(vic)) hurt(vic, DMG.rubber);
      break;
    case 'poop':
      if (!blocked(vic)) { hurt(vic, DMG.poop); vic.say = GROSS[Math.floor(Math.random() * GROSS.length)]; vic.sayT = 1.6; }
      break;
    case 'ghost':
      if (!blocked(vic)) { hurt(vic, DMG.ghost); addText(vic.x, vic.y + vic.r + 18, 'Boo!', '#e9e4ff', 16); }
      break;
    case 'bubble':
      if (!blocked(vic)) hurt(vic, DMG.bubble);
      break;
  }
}

function collide(A, B) {
  if (faded(A) || faded(B)) return;   // ghosts pass right through
  const dx = B.x - A.x, dy = B.y - A.y, dist = Math.hypot(dx, dy), min = A.r + B.r;
  if (dist >= min || dist === 0) return;
  const nx = dx / dist, ny = dy / dist, over = min - dist;
  const aFix = immobile(A), bFix = immobile(B);
  if (aFix && !bFix) { B.x += nx * over; B.y += ny * over; }
  else if (bFix && !aFix) { A.x -= nx * over; A.y -= ny * over; }
  else { A.x -= nx * over / 2; A.y -= ny * over / 2; B.x += nx * over / 2; B.y += ny * over / 2; }
  const an = A.vx * nx + A.vy * ny, bn = B.vx * nx + B.vy * ny;
  if (an - bn <= 0 && !(aFix || bFix)) return;   // already moving apart
  if (!aFix && !bFix) { A.vx += (bn - an) * nx; A.vy += (bn - an) * ny; B.vx += (an - bn) * nx; B.vy += (an - bn) * ny; }
  else if (aFix && !bFix && bn < 0) { B.vx -= 2 * bn * nx; B.vy -= 2 * bn * ny; }
  else if (bFix && !aFix && an > 0) { A.vx -= 2 * an * nx; A.vy -= 2 * an * ny; }
  if (world.contactCd > 0) return;
  world.contactCd = .45;
  A.squash = B.squash = 1;
  burst(A.x + nx * A.r, A.y + ny * A.r, ['#ffffff', '#ffe066'], 5, 120);
  effect(A, B, nx, ny);
  effect(B, A, -nx, -ny);
}

// one physics step of a fight (no drawing, so it can also run fast for balance tests)
function stepWorld(dt) {
  const w = world;
  w.time += dt; w.contactCd = Math.max(0, w.contactCd - dt);
  if (w.time > OVERTIME && !w.overtime) { w.overtime = true; addText(W / 2, 300, 'Overtime!', '#f5b82e', 30); }
  for (const b of w.balls) {
    b.immune = Math.max(0, b.immune - dt); b.squash = Math.max(0, b.squash - dt * 5); b.sayT -= dt;
    if (!b.shield && (b.shieldT -= dt) <= 0) b.shield = true;
    if (b.freeze > 0) {
      b.freezeT += dt;
      const d = (DMG.freezeBase + DMG.freezeRamp * b.freezeT) * dt;   // the longer you stay frozen, the faster it hurts
      b.frozenDmg += d; hurt(b, d, false);
      b.freeze -= dt;
      if (b.freeze <= 0) { b.freeze = 0; addText(b.x, b.y - b.r - 10, '-' + Math.round(b.frozenDmg), '#ff6b6b'); b.hurtT = w.time; burst(b.x, b.y, ['#ffffff', '#cdf3ff'], 14); resume(b); }
    } else if (b.stun > 0) {
      b.stun -= dt; hurt(b, DMG.shockDrain * dt, false);   // zapped balls keep losing energy
      if (b.stun <= 0) { b.stun = 0; resume(b); }
    } else {
      // straight lines at a steady speed, bouncing off the walls
      const sp = TYPES[b.type].speed, m = Math.hypot(b.vx, b.vy) || 1;
      b.vx = b.vx / m * sp; b.vy = b.vy / m * sp;
      b.x += b.vx * dt; b.y += b.vy * dt;
      walls(b);
      b.ang += angDiff(b.ang, Math.atan2(b.vy, b.vx)) * Math.min(1, dt * 10);
      if (b.type === 'fire' && (b.fireCd -= dt) <= 0) { b.fireCd = FIRE_EVERY; shoot(b, 'fire', rand(0, TAU), 280); }
      if (b.type === 'ninja' && (b.ninjaCd -= dt) <= 0) { b.ninjaCd = 2; for (const s of [-.3, 0, .3]) shoot(b, 'star', b.ang + s, 300); }
      if (b.type === 'laser' && (b.laserCd -= dt) <= 0) { b.laserCd = DMG.laserEvery; fireLaser(b); }
      if (b.type === 'bomb' && (b.bombCd -= dt) <= 0) { b.bombCd = 2.2; w.bombs.push({x: b.x, y: b.y, t: w.time, owner: b.team}); }
      if (b.type === 'slime' && (b.slimeCd -= dt) <= 0) { b.slimeCd = .7; w.puddles.push({x: b.x, y: b.y, t: w.time, owner: b.team, seed: Math.random() * 1e6 | 0}); }
    }
    if (w.overtime) hurt(b, 5 * dt, false);
  }
  collide(w.balls[0], w.balls[1]);

  // fireballs and ninja stars
  for (let i = w.shots.length - 1; i >= 0; i--) {
    const s = w.shots[i], target = w.balls[1 - s.owner];
    s.x += s.vx * dt; s.y += s.vy * dt; s.spin += dt * 14;
    if (Math.hypot(s.x - target.x, s.y - target.y) < s.r + target.r && !faded(target)) {
      w.shots.splice(i, 1);
      if (!blocked(target)) hurt(target, DMG[s.kind]);
      burst(s.x, s.y, s.kind === 'fire' ? ['#ffe066', '#ff7a1f', '#ff3d1f'] : ['#d9dde6', '#ffffff'], 10);
      continue;
    }
    let bounced = false;
    if (s.x < AX0 + s.r || s.x > AX1 - s.r) { s.vx = -s.vx; bounced = true; }
    if (s.y < AY0 + s.r || s.y > AY1 - s.r) { s.vy = -s.vy; bounced = true; }
    if (bounced && ++s.bounces > (s.kind === 'fire' ? 2 : 0)) { w.shots.splice(i, 1); burst(s.x, s.y, s.kind === 'fire' ? ['#ff7a1f'] : ['#d9dde6'], 5, 80); }
  }

  // bombs go off after their fuse burns down
  for (let i = w.bombs.length - 1; i >= 0; i--) {
    const bm = w.bombs[i];
    if (w.time - bm.t < BOMB_FUSE) continue;
    w.bombs.splice(i, 1);
    w.rings.push({x: bm.x, y: bm.y - 10, t: w.time, color: '#ffb020', big: true});
    burst(bm.x, bm.y, ['#ffe066', '#ff7a1f', '#555555', '#ffffff'], 26, 260);
    const target = w.balls[1 - bm.owner];
    if (Math.hypot(target.x - bm.x, target.y - bm.y) < DMG.bombRadius + target.r * .5 && !faded(target) && !blocked(target)) { hurt(target, DMG.bomb); addText(target.x, target.y + target.r + 18, 'Boom!', '#ffb020', 18); }
  }

  // slime puddles hurt the other ball while it rolls through them
  w.puddles = w.puddles.filter(p => w.time - p.t < 5);
  for (const b of w.balls) {
    if (faded(b)) continue;
    if (w.puddles.some(p => p.owner !== b.team && Math.hypot(b.x - p.x, b.y - p.y) < 20 + b.r * .7)) {
      const d = DMG.slime * dt; hurt(b, d, false); b.slimeDmg += d;
      if (b.slimeDmg >= 5) { addText(b.x, b.y - b.r - 10, '-' + Math.round(b.slimeDmg), '#9be36b'); b.slimeDmg = 0; }
    }
  }
  w.beams = w.beams.filter(bm => w.time - bm.t < .3);

  const [A, B] = w.balls;
  if (A.hp <= 0 || B.hp <= 0) {
    const loser = A.hp <= 0 && B.hp <= 0 ? (Math.random() < .5 ? A : B) : (A.hp <= 0 ? A : B);
    w.loser = loser; w.winner = other(loser); w.phase = 'over'; w.overT = 0;
  }
}

// ================= round flow =================
function startRound() {
  world = newWorld(match.types[0], match.types[1]);
}

function tick(dt) {
  const w = world;
  if (w.phase === 'intro') {
    w.introT += dt; w.time += dt;
    const t = w.introT;
    w.balls.forEach(b => {
      const dropX = b.team ? 290 : 110;
      if (t < .8) { b.x = shipX(b.team, t); b.y = 112; b.g = 0; b.r = R * .35; }
      else {
        const k = Math.min(1, (t - .8) / 1.4);
        b.x = dropX; b.y = 112 + 188 * k * k; b.r = R * (.35 + .65 * k); b.g = k * k * (3 - 2 * k);
        if (k >= 1 && !b.landed) { b.landed = true; w.rings.push({x: b.x, y: b.y, t: w.time, color: TEAM[b.team].light}); burst(b.x, b.y + b.r, ['#ffffff', TEAM[b.team].light], 10); }
      }
    });
    if (t >= 2.2 && !w.saidRound) { w.saidRound = true; addText(W / 2, 250, 'Round ' + match.round, '#ffffff', 34); }
    if (t >= 2.6) w.phase = 'aim';
  } else if (w.phase === 'aim') {
    w.time += dt;
    if (aimHold) w.balls[aimHold.team].aim += aimHold.dir * 2.2 * dt;
    w.balls.forEach(b => { b.ang = b.aim; });
  } else if (w.phase === 'fight') {
    stepWorld(dt);
  } else if (w.phase === 'over') {
    w.time += dt; w.overT += dt;
    if (!w.counted) {
      w.counted = true;
      match.wins[w.winner.team]++;
      w.loser.dying = {kind: w.winner.type === 'poop' ? 'melt' : 'pop', t: 0};
      if (w.loser.dying.kind === 'pop') burst(w.loser.x, w.loser.y, [TYPES[w.loser.type].color, '#ffffff', '#ffe066'], 36, 260);
      else addText(w.loser.x, w.loser.y + 70, 'Eww… melting!', '#9be36b', 18);
      w.winner.vx = w.winner.vy = 0; w.winner.stun = w.winner.freeze = 0;
      addText(W / 2, 190, `${TYPES[w.winner.type].name}`, TEAM[w.winner.team].light, 26);
      addText(W / 2, 222, 'wins the round!', '#ffffff', 22);
      recordWin(w.winner.type);
    }
    w.loser.dying.t += dt;
    if (w.overT > 2.8) {
      if (Math.max(...match.wins) >= 2) endMatch();
      else { match.round++; showTurn(0); }
    }
  }
  w.shards.forEach(s => { s.life += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= .97; s.vy *= .97; });
  w.shards = w.shards.filter(s => s.life < s.max);
  const aiming = w.phase === 'aim';
  if (aimRow.hidden === aiming) aimRow.hidden = !aiming;
  w.texts = w.texts.filter(t => w.time - t.t < 1.3);
  w.rings = w.rings.filter(r => w.time - r.t < .6);
}

const shipX = (team, t) => team ? 290 - (t - .8) * 230 : 110 + (t - .8) * 230;

function endMatch() {
  if (world.phase === 'done') return;
  world.phase = 'done';
  const winTeam = match.wins[0] >= 2 ? 0 : 1;
  document.getElementById('moTitle').textContent = `${winTeam ? 'Red' : 'Blue'} player wins!`;
  document.getElementById('moText').textContent = `${match.wins[winTeam]} – ${match.wins[1 - winTeam]}`;
  document.getElementById('matchOver').hidden = false;
  overAt = performance.now();
}

// ================= drawing the arena =================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const dpr = Math.min(window.devicePixelRatio || 1, 3);
cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);
const STARS = Array.from({length: 50}, () => ({x: rand(0, W), y: rand(0, H), r: rand(.3, 1.4)}));

function roundRect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

function draw() {
  const w = world, c = ctx;
  c.fillStyle = '#151832'; c.fillRect(0, 0, W, H);
  c.fillStyle = 'rgba(255,255,255,.45)';
  STARS.forEach(s => { c.beginPath(); c.arc(s.x, s.y, s.r, 0, TAU); c.fill(); });

  // arena floor
  roundRect(c, AX0 - 4, AY0 - 4, AX1 - AX0 + 8, AY1 - AY0 + 8, 20);
  const fl = c.createLinearGradient(0, AY0, 0, AY1);
  fl.addColorStop(0, '#2c3b6b'); fl.addColorStop(1, '#1d274b');
  c.fillStyle = fl; c.fill();
  c.strokeStyle = w.overtime ? '#ff9f43' : '#7b6cff'; c.lineWidth = 4; c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.08)'; c.lineWidth = 1;
  for (let x = AX0 + 47; x < AX1; x += 47) { c.beginPath(); c.moveTo(x, AY0); c.lineTo(x, AY1); c.stroke(); }
  for (let y = AY0 + 45; y < AY1; y += 45) { c.beginPath(); c.moveTo(AX0, y); c.lineTo(AX1, y); c.stroke(); }
  c.strokeStyle = 'rgba(255,255,255,.18)'; c.lineWidth = 3;
  c.beginPath(); c.arc(W / 2, (AY0 + AY1) / 2, 60, 0, TAU); c.stroke();
  c.beginPath(); c.moveTo(AX0, (AY0 + AY1) / 2); c.lineTo(AX1, (AY0 + AY1) / 2); c.stroke();

  w.puddles.forEach(p => {   // slime goo on the floor
    const age = w.time - p.t, a = Math.min(1, age * 4) * Math.min(1, (5 - age) * 1.5), rnd = prng(p.seed);
    c.fillStyle = `rgba(95,211,90,${.45 * a})`;
    c.beginPath(); c.ellipse(p.x, p.y, 22, 17, rnd() * 3, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(p.x + (rnd() - .5) * 20, p.y + (rnd() - .5) * 16, 12, 9, 0, 0, TAU); c.fill();
  });

  w.rings.forEach(r => {
    const k = (w.time - r.t) / .6, size = r.big ? DMG.bombRadius : 60;
    c.strokeStyle = r.color; c.globalAlpha = 1 - k; c.lineWidth = r.big ? 8 : 4;
    c.beginPath(); c.ellipse(r.x, r.y + 10, 20 + k * size, (20 + k * size) * (r.big ? .8 : .45), 0, 0, TAU); c.stroke();
    if (r.big) { c.fillStyle = `rgba(255,170,40,${.35 * (1 - k)})`; c.fill(); }
    c.globalAlpha = 1;
  });

  w.bombs.forEach(bm => {   // ticking bombs
    const left = BOMB_FUSE - (w.time - bm.t), blink = Math.floor(w.time * (left < .6 ? 14 : 6)) % 2;
    c.fillStyle = 'rgba(255,90,60,.18)'; c.beginPath(); c.arc(bm.x, bm.y, DMG.bombRadius, 0, TAU); c.fill();
    sphere(c, bm.x, bm.y, 11, '#2b2b33');
    c.strokeStyle = '#c9a26b'; c.lineWidth = 2; c.beginPath(); c.moveTo(bm.x + 5, bm.y - 9); c.lineTo(bm.x + 9, bm.y - 15); c.stroke();
    c.fillStyle = blink ? '#ff3d1f' : '#ffe066'; c.beginPath(); c.arc(bm.x + 9, bm.y - 16, 3.5, 0, TAU); c.fill();
  });

  if (w.phase === 'aim') w.balls.forEach(drawAim);

  // fireballs
  w.shots.forEach(s => {
    if (s.kind === 'star') {   // ninja star
      c.save(); c.translate(s.x, s.y); c.rotate(s.spin);
      c.fillStyle = '#c7ccd6'; c.strokeStyle = '#6b7280'; c.lineWidth = 1;
      c.beginPath();
      for (let i = 0; i < 8; i++) { const a = i / 8 * TAU, rr = i % 2 ? 3 : 10; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      c.closePath(); c.fill(); c.stroke();
      c.fillStyle = '#3b3f48'; c.beginPath(); c.arc(0, 0, 2, 0, TAU); c.fill();
      c.restore(); return;
    }
    const sp = Math.hypot(s.vx, s.vy), tx = -s.vx / sp, ty = -s.vy / sp;
    const tg = c.createLinearGradient(s.x, s.y, s.x + tx * 26, s.y + ty * 26);
    tg.addColorStop(0, 'rgba(255,140,30,.8)'); tg.addColorStop(1, 'rgba(255,60,20,0)');
    c.strokeStyle = tg; c.lineWidth = 10; c.lineCap = 'round';
    c.beginPath(); c.moveTo(s.x, s.y); c.lineTo(s.x + tx * 26, s.y + ty * 26); c.stroke();
    const fg = c.createRadialGradient(s.x, s.y, 1, s.x, s.y, s.r * 1.4);
    fg.addColorStop(0, '#fff6b0'); fg.addColorStop(.5, '#ffb020'); fg.addColorStop(1, 'rgba(255,80,20,0)');
    c.fillStyle = fg; c.beginPath(); c.arc(s.x, s.y, s.r * 1.4, 0, TAU); c.fill();
  });

  w.balls.forEach(b => drawFighter(b));

  w.beams.forEach(bm => {   // laser beams
    const k = (w.time - bm.t) / .3;
    c.lineCap = 'round';
    c.strokeStyle = `rgba(255,40,80,${.45 * (1 - k)})`; c.lineWidth = 14;
    c.beginPath(); c.moveTo(bm.x1, bm.y1); c.lineTo(bm.x2, bm.y2); c.stroke();
    c.strokeStyle = `rgba(255,220,230,${1 - k})`; c.lineWidth = 4; c.stroke();
  });

  // ships fly over during the drop
  if (w.phase === 'intro' && w.introT < 3.4) {
    [0, 1].forEach(team => {
      const x = shipX(team, w.introT), y = 100;
      if (w.introT > .7 && w.introT < 1.1) {
        c.fillStyle = 'rgba(255,255,180,.25)';
        c.beginPath(); c.moveTo(x - 12, y + 8); c.lineTo(x + 12, y + 8); c.lineTo(x + 24, y + 60); c.lineTo(x - 24, y + 60); c.fill();
      }
      drawShip(c, x, y, team, w.time);
    });
  }

  // shards and words
  w.shards.forEach(s => { c.globalAlpha = 1 - s.life / s.max; c.fillStyle = s.color; c.fillRect(s.x - s.size / 2, s.y - s.size / 2, s.size, s.size); });
  c.globalAlpha = 1;
  w.texts.forEach(t => {
    const k = (w.time - t.t) / 1.3;
    c.globalAlpha = 1 - k * k; c.font = `700 ${t.size}px Fredoka, sans-serif`; c.textAlign = 'center';
    c.lineWidth = 4; c.strokeStyle = 'rgba(15,17,38,.85)';
    const x = clamp(t.x, 60, W - 60), y = t.y - k * 26;
    c.strokeText(t.text, x, y); c.fillStyle = t.color; c.fillText(t.text, x, y);
  });
  c.globalAlpha = 1;
  drawHud();
}

function drawFighter(b) {
  const c = ctx, w = world, o = other(b);
  if (b.dying) {
    const t = b.dying.t;
    if (b.dying.kind === 'pop') {
      if (t > .15) return;
      c.globalAlpha = 1 - t / .15;
      drawBall(c, b.type, b.x, b.y, b.r * (1 + t * 3), {g: b.g, ang: b.ang, t: w.time});
      c.globalAlpha = 1; return;
    }
    // melt off the bottom of the screen
    const k = Math.min(1, t / .8), drop = Math.max(0, t - .5) ** 2 * 220;
    c.fillStyle = mix(TYPES[b.type].color, '#7cc242', .35); c.globalAlpha = Math.max(0, 1 - t / 2.6);
    c.beginPath(); c.ellipse(b.x, b.y + b.r * .9 + drop, b.r * (1 + k * .8), b.r * .35, 0, 0, TAU); c.fill();
    for (let i = -2; i <= 2; i++) { c.beginPath(); c.ellipse(b.x + i * b.r * .45, b.y + b.r + drop + k * (8 + Math.abs(i * 7)), 3.5, 6 + k * 10, 0, 0, TAU); c.fill(); }
    c.save(); c.translate(b.x, b.y + drop + b.r * k * .5); c.scale(1 + k * .35, 1 - k * .55);
    drawBall(c, b.type, 0, 0, b.r, {g: b.g, ang: b.ang, t: w.time, lx: 0, ly: 1});
    c.restore(); c.globalAlpha = 1;
    return;
  }
  // team ring so mirror matches stay readable
  c.strokeStyle = TEAM[b.team].light; c.lineWidth = 3; c.globalAlpha = .9;
  c.beginPath(); c.ellipse(b.x, b.y + b.r * .85, b.r * .95, b.r * .35, 0, 0, TAU); c.stroke(); c.globalAlpha = 1;

  if (b.type === 'laser' && w.phase === 'fight' && b.laserCd < .5 && !immobile(b)) {   // charging up
    const k = 1 - b.laserCd / .5;
    c.fillStyle = `rgba(255,40,80,${.35 * k})`; c.beginPath(); c.arc(b.x, b.y, b.r * (1.1 + .4 * k), 0, TAU); c.fill();
  }
  const sq = b.type === 'rubber' ? b.squash * .3 : b.squash * .12;
  c.save(); c.translate(b.x, b.y); c.scale(1 + sq, 1 - sq);
  if (faded(b)) c.globalAlpha = .28 + .1 * Math.sin(w.time * 20);
  drawBall(c, b.type, 0, 0, b.r, {g: b.g, ang: b.ang, t: w.time, shield: b.shield});
  c.restore();

  if (w.time - b.hurtT < .18) { c.fillStyle = 'rgba(255,60,60,.45)'; c.beginPath(); c.arc(b.x, b.y, b.r, 0, TAU); c.fill(); }

  if (b.freeze > 0) {   // turned into a snowball
    const sr = b.r * 1.3;
    const sg = c.createRadialGradient(b.x - sr * .3, b.y - sr * .35, 2, b.x, b.y, sr);
    sg.addColorStop(0, '#ffffff'); sg.addColorStop(1, '#bcd8e8');
    c.fillStyle = sg; c.beginPath(); c.arc(b.x, b.y, sr, 0, TAU); c.fill();
    c.fillStyle = 'rgba(160,200,225,.8)';
    for (let i = 0; i < 7; i++) { const a = i * 2.4, rr = sr * (.3 + (i * .37) % .55); c.beginPath(); c.arc(b.x + Math.cos(a) * rr, b.y + Math.sin(a) * rr, 2, 0, TAU); c.fill(); }
    c.fillStyle = '#4fa3c7'; c.font = '700 11px Fredoka, sans-serif'; c.textAlign = 'center';
    c.fillText('❄ ' + b.freeze.toFixed(1), b.x, b.y + sr + 12);
  }
  if (b.stun > 0) {   // zapped: sparks and spinning stars
    const rnd = prng(Math.floor(w.time * 16) + b.team * 50);
    c.strokeStyle = '#fff36b'; c.lineWidth = 2;
    for (let k = 0; k < 3; k++) {
      const a = rnd() * TAU; c.beginPath(); c.moveTo(b.x + Math.cos(a) * b.r, b.y + Math.sin(a) * b.r);
      c.lineTo(b.x + Math.cos(a + .2) * b.r * 1.4, b.y + Math.sin(a + .2) * b.r * 1.4); c.lineTo(b.x + Math.cos(a - .1) * b.r * 1.7, b.y + Math.sin(a - .1) * b.r * 1.7); c.stroke();
    }
    c.font = '14px sans-serif'; c.textAlign = 'center'; c.fillStyle = '#ffe066';
    for (let i = 0; i < 3; i++) { const a = w.time * 4 + i * TAU / 3; c.fillText('★', b.x + Math.cos(a) * b.r * .9, b.y - b.r - 6 + Math.sin(a) * 5); }
  }
  if (b.sayT > 0 && b.say) {   // speech bubble
    c.font = '700 14px Fredoka, sans-serif'; c.textAlign = 'center';
    const tw = c.measureText(b.say).width + 16, bx = clamp(b.x, tw / 2 + 4, W - tw / 2 - 4), by = Math.max(AY0 + 20, b.y - b.r - 34);
    c.fillStyle = '#ffffff'; roundRect(c, bx - tw / 2, by - 15, tw, 26, 10); c.fill();
    c.beginPath(); c.moveTo(clamp(b.x, bx - tw / 2 + 10, bx + tw / 2 - 10) - 6, by + 10); c.lineTo(b.x, by + 20); c.lineTo(clamp(b.x, bx - tw / 2 + 10, bx + tw / 2 - 10) + 6, by + 10); c.fill();
    c.fillStyle = '#4c7a1f'; c.fillText(b.say, bx, by + 3);
  }
}

// arrow plus a dotted line showing where the ball will go, bounces included
function drawAim(b) {
  const c = ctx, col = TEAM[b.team].light, pulse = .75 + .25 * Math.sin(world.time * 6);
  let x = b.x, y = b.y, dx = Math.cos(b.aim), dy = Math.sin(b.aim), left = 330;
  c.save(); c.strokeStyle = col; c.globalAlpha = .8 * pulse; c.lineWidth = 3; c.setLineDash([2, 9]); c.lineCap = 'round';
  c.beginPath(); c.moveTo(x, y);
  for (let n = 0; n < 4 && left > 0; n++) {
    const tx = dx > 0 ? (AX1 - b.r - x) / dx : dx < 0 ? (AX0 + b.r - x) / dx : Infinity;
    const ty = dy > 0 ? (AY1 - b.r - y) / dy : dy < 0 ? (AY0 + b.r - y) / dy : Infinity;
    const step = Math.min(tx, ty, left);
    x += dx * step; y += dy * step; left -= step; c.lineTo(x, y);
    if (step === tx) dx = -dx; else if (step === ty) dy = -dy;
  }
  c.stroke(); c.restore();
  // the arrow
  const ax = Math.cos(b.aim), ay = Math.sin(b.aim), x0 = b.x + ax * (b.r + 6), y0 = b.y + ay * (b.r + 6), L = 46;
  const x1 = x0 + ax * L, y1 = y0 + ay * L;
  c.strokeStyle = 'rgba(15,17,38,.8)'; c.lineWidth = 11; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
  c.strokeStyle = col; c.lineWidth = 7; c.stroke();
  c.fillStyle = col; c.strokeStyle = 'rgba(15,17,38,.8)'; c.lineWidth = 2.5;
  c.beginPath();
  c.moveTo(x1 + ax * 16, y1 + ay * 16);
  c.lineTo(x1 - ay * 12, y1 + ax * 12); c.lineTo(x1 + ay * 12, y1 - ax * 12); c.closePath(); c.stroke(); c.fill();
}

function drawHud() {
  const c = ctx, w = world;
  c.fillStyle = '#0f1126'; c.fillRect(0, 0, W, 62);
  w.balls.forEach(b => {
    const right = b.team === 1, x0 = right ? 222 : 10, bw = 168;
    c.font = '600 13px Fredoka, sans-serif'; c.textAlign = right ? 'right' : 'left'; c.fillStyle = TEAM[b.team].light;
    c.fillText(TYPES[b.type].name, right ? 390 : 10, 22);
    roundRect(c, x0, 31, bw, 13, 6.5); c.fillStyle = '#2a2e52'; c.fill();
    const hw = bw * b.hp / HP;
    if (hw > 0) {
      roundRect(c, right ? x0 + bw - hw : x0, 31, Math.max(hw, 6), 13, 6.5);
      c.fillStyle = b.hp > 50 ? '#5dd39e' : b.hp > 25 ? '#ffd23f' : '#ff4d6d'; c.fill();
    }
    c.font = '600 10px Fredoka, sans-serif'; c.fillStyle = 'rgba(255,255,255,.7)';
    c.fillText(`${Math.ceil(b.hp)} energy`, right ? 390 : 10, 57);
  });
  c.textAlign = 'center';
  c.font = '600 11px Fredoka, sans-serif'; c.fillStyle = 'rgba(255,255,255,.65)'; c.fillText('Round ' + match.round, W / 2, 18);
  c.font = '700 20px Fredoka, sans-serif'; c.fillStyle = '#ffffff'; c.fillText(`${match.wins[0]}-${match.wins[1]}`, W / 2, 43);
  if (w.phase === 'aim') {
    c.font = '700 15px Fredoka, sans-serif'; c.fillStyle = '#ffffff'; c.globalAlpha = .85;
    c.fillText('Aim the arrows, then tap GO!', W / 2, AY1 - 16); c.globalAlpha = 1;
  }
  if (w.overtime && w.phase === 'fight') { c.font = '700 11px Fredoka, sans-serif'; c.fillStyle = '#ff9f43'; c.fillText('OVERTIME', W / 2, 58); }
}

function frame(t) {
  const dt = Math.min(1 / 30, (t - lastFrame) / 1000); lastFrame = t;
  if (!arenaView.hidden && world) { if (world.phase !== 'done') tick(dt); else world.time += dt; draw(); }
  if (!turnView.hidden) drawReels(t / 1000);
  requestAnimationFrame(frame);
}

// ================= start screen and spin turns =================
const selectView = document.getElementById('selectView'), arenaView = document.getElementById('arenaView'), turnView = document.getElementById('turnView');
const reelsEl = document.getElementById('reels'), spinBtn = document.getElementById('spinBtn'), turnHint = document.getElementById('turnHint');
const NAMES = ['Blue', 'Red'];
function sizeCanvas(cv, css, cssH = css) { cv.width = css * dpr; cv.height = cssH * dpr; const c = cv.getContext('2d'); c.scale(dpr, dpr); return c; }

// three reels; each spins through random balls and stops on its own ball, left to right
const reels = [0, 1, 2].map(i => {
  const el = document.createElement('button');
  el.className = 'reel'; el.disabled = true;
  el.innerHTML = '<canvas></canvas><b></b><span></span>';
  el.addEventListener('click', () => choose(i));
  reelsEl.appendChild(el);
  return {el, ctx: sizeCanvas(el.querySelector('canvas'), 84, 100), seq: [], start: 0, dur: 0, done: false};
});
let turn = null;   // {team, spun, chosen}

function showTurn(team) {
  turn = {team, spun: false, chosen: false};
  selectView.hidden = arenaView.hidden = true; turnView.hidden = false;
  document.getElementById('turnCard').className = 'turn ' + (team ? 'red' : 'blue');
  document.getElementById('turnRound').textContent = `Round ${match.round} · Blue ${match.wins[0]} – ${match.wins[1]} Red`;
  document.getElementById('turnTitle').textContent = `${NAMES[team]} player's turn`;
  turnHint.textContent = `Hand the device to ${NAMES[team]}, then spin!`;
  reels.forEach(r => { r.seq = []; r.done = false; r.el.disabled = true; r.el.classList.remove('chosen'); r.el.querySelector('b').textContent = '?'; r.el.querySelector('span').textContent = ''; });
  spinBtn.hidden = false; spinBtn.focus();
}

function spin() {
  if (!turn || turn.spun) return;
  turn.spun = true; spinBtn.hidden = true; turnHint.textContent = 'Spinning…';
  const hand = [...ORDER].sort(() => Math.random() - .5).slice(0, 3);   // 3 different balls
  const now = performance.now() / 1000;
  reels.forEach((r, i) => {
    r.seq = Array.from({length: 16 + i * 5}, () => ORDER[Math.random() * ORDER.length | 0]);
    r.seq.push(hand[i]); r.start = now; r.dur = 1.3 + i * .5; r.done = false;
  });
}

function choose(i) {
  if (!turn || turn.chosen || !reels.every(r => r.done)) return;
  turn.chosen = true;
  reels[i].el.classList.add('chosen');
  match.types[turn.team] = reels[i].seq[reels[i].seq.length - 1];
  turnHint.textContent = `${TYPES[match.types[turn.team]].name}!`;
  const t = turn;
  setTimeout(() => { if (turn !== t) return; if (t.team === 0) showTurn(1); else startRoundView(); }, 700);
}

function drawReels(t) {
  reels.forEach(r => {
    const c = r.ctx; c.clearRect(0, 0, 84, 100);
    if (!r.seq.length) { c.fillStyle = 'rgba(255,255,255,.5)'; c.font = '700 40px Fredoka, sans-serif'; c.textAlign = 'center'; c.fillText('?', 42, 64); return; }
    const k = Math.min(1, (t - r.start) / r.dur), last = r.seq.length - 1;
    const pos = last * (1 - Math.pow(1 - k, 3));   // fast, then slowing down
    if (k >= 1 && !r.done) {
      r.done = true; const id = r.seq[last];
      r.el.querySelector('b').textContent = TYPES[id].name; r.el.querySelector('span').textContent = TYPES[id].power;
      if (reels.every(q => q.done)) { reels.forEach(q => { q.el.disabled = false; }); turnHint.textContent = 'Pick one ball!'; }
    }
    for (let j = Math.floor(pos) - 1; j <= Math.floor(pos) + 2; j++) {
      if (j < 0 || j > last) continue;
      drawBall(c, r.seq[j], 42, 50 + (j - pos) * 66, 24, {g: 1, ang: -.5, t, lx: 0, ly: .3});
    }
  });
}

function startMatch() {
  match = {types: [null, null], wins: [0, 0], round: 1};
  document.getElementById('matchOver').hidden = true;
  showTurn(0);
}
function startRoundView() { turnView.hidden = true; arenaView.hidden = false; startRound(); }
function showStart() { arenaView.hidden = turnView.hidden = true; selectView.hidden = false; world = null; turn = null; loadWins(); }
document.getElementById('goBtn').addEventListener('click', startMatch);
spinBtn.addEventListener('click', spin);
document.getElementById('quitBtn').addEventListener('click', showStart);
document.getElementById('turnQuit').addEventListener('click', showStart);
document.getElementById('rematchBtn').addEventListener('click', () => { if (performance.now() - overAt > 500) startMatch(); });

// ================= aiming =================
const aimRow = document.getElementById('aimRow');
let aimHold = null, aimDrag = null;
aimRow.querySelectorAll('[data-team]').forEach(el => {
  const hold = {team: +el.dataset.team, dir: +el.dataset.dir};
  el.addEventListener('pointerdown', e => { e.preventDefault(); aimHold = hold; });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, () => { if (aimHold === hold) aimHold = null; }));
});
document.getElementById('fightBtn').addEventListener('click', () => {
  if (!world || world.phase !== 'aim') return;
  aimHold = aimDrag = null;
  world.phase = 'fight'; world.balls.forEach(launch);
  addText(W / 2, 250, 'FIGHT!', '#f5b82e', 44);
});
const toArena = e => { const r = cv.getBoundingClientRect(); return {x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H}; };
function dragAim(e) {
  const p = toArena(e), b = world.balls[aimDrag];
  if (Math.hypot(p.x - b.x, p.y - b.y) > 8) b.aim = Math.atan2(p.y - b.y, p.x - b.x);
}
cv.addEventListener('pointerdown', e => {
  if (!world || world.phase !== 'aim') return;
  const p = toArena(e);
  aimDrag = world.balls.reduce((best, b) => Math.hypot(p.x - b.x, p.y - b.y) < Math.hypot(p.x - best.x, p.y - best.y) ? b : best).team;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  dragAim(e);
});
cv.addEventListener('pointermove', e => { if (aimDrag !== null && world && world.phase === 'aim') dragAim(e); });
cv.addEventListener('pointerup', () => { aimDrag = null; });

// ================= wins chart (shared online, falls back to this device) =================
const WIN_KEY = 'battle-balls-wins';
function localWins() { try { return JSON.parse(localStorage.getItem(WIN_KEY)) || {}; } catch (e) { return {}; } }

function renderWins(counts, online) {
  const max = Math.max(1, ...ORDER.map(id => counts[id] || 0));
  document.getElementById('winBars').innerHTML = ORDER.map(id => `
    <div class="bar-row"><span>${TYPES[id].short}</span>
      <div class="bar-track"><div class="bar" style="width:${(counts[id] || 0) / max * 100}%;background:${TYPES[id].color}"></div></div>
      <b>${counts[id] || 0}</b></div>`).join('');
  document.getElementById('winsNote').textContent = online ? 'Round wins from everyone who plays.' : 'Round wins on this device.';
}

async function loadWins() {
  renderWins(localWins(), false);
  try {
    const counts = {};
    await Promise.all(ORDER.map(async id => {
      const r = await fetch(`${HighScores.url}/rest/v1/scores?select=id&game=eq.battle-balls&name=eq.${id}&limit=1`,
        {headers: {apikey: HighScores.key, Prefer: 'count=exact'}});
      const total = (r.headers.get('content-range') || '').split('/')[1];
      if (!r.ok || total === undefined) throw new Error('no count');
      counts[id] = +total;
    }));
    renderWins(counts, true);
  } catch (e) { /* keep this device's counts */ }
}

function recordWin(type) {
  const w = localWins(); w[type] = (w[type] || 0) + 1;
  try { localStorage.setItem(WIN_KEY, JSON.stringify(w)); } catch (e) {}
  fetch(`${HighScores.url}/rest/v1/scores`, {
    method: 'POST', headers: {apikey: HighScores.key, 'Content-Type': 'application/json', Prefer: 'return=minimal'},
    body: JSON.stringify({game: 'battle-balls', name: type, score: 1})
  }).catch(() => {});
}

loadWins();
requestAnimationFrame(frame);
</script>
